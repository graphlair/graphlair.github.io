<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"></head>
<body>
<script>
(async()=>{
  const full=location.pathname+location.search+location.hash;
  let base=localStorage.getItem('graphlair_app_base')||'';
  if(!base && location.hostname.endsWith('github.io')){
    const first=location.pathname.split('/').filter(Boolean)[0];
    if(first){
      try{const r=await fetch('/'+first+'/config.js',{method:'HEAD',cache:'no-store'});if(r.ok)base='/'+first}catch(e){}
    }
  }
  sessionStorage.setItem('graphlair_requested_path',full);
  location.replace((base||'')+'/');
})();
</script>
</body></html>
