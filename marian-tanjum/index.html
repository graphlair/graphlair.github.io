<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Graphlair — Team</title>
<meta name="description" content="Graphlair team profile.">
<style>
:root{--acid:#98FC1C;--black:#050505;--paper:#f3f3ed}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--black);color:#fff;font-family:Arial,Helvetica,sans-serif}
a{color:inherit;text-decoration:none}
::selection{background:var(--acid);color:#000}
.page{min-height:100vh;padding:22px}
.topbar{height:66px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.15);font:800 10px monospace;letter-spacing:.14em;text-transform:uppercase}
.brand{font-size:17px;font-family:Arial;font-weight:950;letter-spacing:.15em}.brand b{color:var(--acid)}
.topbar a:last-child{border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:10px 14px}
.profile-grid{min-height:calc(100vh - 110px);display:grid;grid-template-columns:1.02fr .98fr;gap:18px;padding-top:18px}
.profile-visual{position:relative;min-height:680px;overflow:hidden;background:#101010;border:1px solid rgba(255,255,255,.14)}
.profile-visual:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(152,252,28,.08) 0 1px,transparent 1px 30px)}
.profile-visual img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:saturate(.94);z-index:1}
.initials{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(100px,17vw,270px);font-weight:950;letter-spacing:-.08em;color:transparent;-webkit-text-stroke:1px rgba(255,255,255,.75);z-index:1}
.profile-code{position:absolute;left:18px;top:18px;z-index:2;color:#aaa;font:800 9px monospace;letter-spacing:.13em;text-transform:uppercase}
.profile-info{min-height:680px;background:var(--paper);color:#080808;padding:22px;display:grid;grid-template-rows:auto 1fr auto}
.profile-topline{display:flex;justify-content:space-between;gap:20px;color:#676861;font:800 9px monospace;letter-spacing:.13em;text-transform:uppercase;border-bottom:1px solid rgba(0,0,0,.18);padding-bottom:15px}
.profile-main{align-self:center}
.role{font:900 11px monospace;letter-spacing:.14em;text-transform:uppercase;color:#74756f;margin-bottom:18px}
.profile-main h1{font-size:clamp(62px,8.2vw,142px);line-height:.76;letter-spacing:-.085em;text-transform:uppercase;margin:0;max-width:900px}
.profile-main h1:after{content:".";color:var(--acid)}
.profile-main p{max-width:680px;font-size:19px;line-height:1.55;color:#55564f;margin:34px 0 0}
.profile-bottom{display:flex;justify-content:space-between;gap:14px;align-items:center;border-top:1px solid rgba(0,0,0,.18);padding-top:16px;font:900 10px monospace;letter-spacing:.1em}
.profile-bottom a{padding-bottom:4px;border-bottom:1px solid #111}
.profile-bottom .contact{color:#000;background:var(--acid);border:0;border-radius:999px;padding:11px 14px}
.not-found{min-height:80vh;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;max-width:1200px;margin:auto}
.not-found h1{font-size:clamp(70px,12vw,180px);line-height:.75;letter-spacing:-.08em;margin:20px 0 36px}
.cursor,.cursor-dot{position:fixed;z-index:999;pointer-events:none;border-radius:50%;transform:translate(-50%,-50%);mix-blend-mode:difference}
.cursor{width:38px;height:38px;border:1px solid #fff}.cursor-dot{width:4px;height:4px;background:#fff}
@media(max-width:900px){.profile-grid{grid-template-columns:1fr}.profile-visual,.profile-info{min-height:620px}.topbar span:nth-child(2){display:none}}
@media(max-width:560px){.page{padding:12px}.profile-visual{min-height:520px}.profile-info{min-height:540px}.profile-main h1{font-size:clamp(54px,17vw,88px)}.profile-main p{font-size:16px}.profile-bottom{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body data-member-slug="marian-tanjum">
<div class="cursor" id="cursor"></div><div class="cursor-dot" id="cursorDot"></div>
<div class="page">
  <header class="topbar">
    <a class="brand" href="/">GRAPH<b>LAIR</b></a>
    <span>PEOPLE / PROFILE</span>
    <a href="/#team">ALL MEMBERS ↗</a>
  </header>
  <main id="profileContent"></main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../config.js"></script>
<script src="../default-content.js"></script>
<script src="../member.js"></script>
</body>
</html>
