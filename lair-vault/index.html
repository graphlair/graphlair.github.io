<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Graphlair CMS — Lair Vault</title>
<style>
:root{--bg:#080808;--panel:#111;--panel2:#171717;--line:#2a2a2a;--text:#f5f5ef;--muted:#858585;--acid:#98FC1C;--danger:#ff4d4d;--radius:18px}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.auth{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 70% 20%,rgba(152,252,28,.08),transparent 28%),#080808}.auth-card{width:min(460px,100%);border:1px solid var(--line);background:#0d0d0d;padding:28px}.auth-kicker{font:800 10px monospace;letter-spacing:.14em;color:var(--acid);text-transform:uppercase}.auth h1{font-size:48px;letter-spacing:-.06em;margin:16px 0 8px}.auth p{color:var(--muted);line-height:1.5;margin:0 0 24px}.stack{display:grid;gap:12px}.field{display:grid;gap:7px}.field>label{font:800 9px monospace;letter-spacing:.12em;color:#9b9b9b;text-transform:uppercase}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:#0d0d0d;color:#fff;padding:12px 13px;outline:none}.field textarea{min-height:100px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:#666}.primary{border:0;background:var(--acid);color:#050505;padding:12px 15px;font-weight:900}.secondary{border:1px solid var(--line);background:#151515;color:#fff;padding:10px 13px;font-weight:800}.danger{border:1px solid #4d2525;background:#1a0e0e;color:#ff8c8c;padding:9px 12px;font-weight:800}.tiny{padding:7px 9px;font-size:11px}.msg{min-height:20px;color:#ff9090;font-size:12px}
.app{min-height:100vh;display:grid;grid-template-columns:245px 1fr}.sidebar{position:sticky;top:0;height:100vh;border-right:1px solid var(--line);padding:20px 14px;background:#0a0a0a;overflow:auto}.side-brand{font-size:20px;font-weight:950;letter-spacing:-.04em;margin:4px 7px 22px}.side-brand b{color:var(--acid)}.side-label{font:800 8px monospace;color:#626262;letter-spacing:.14em;text-transform:uppercase;margin:18px 8px 8px}.tabs{display:grid;gap:3px}.tab{border:0;background:transparent;color:#919191;text-align:left;padding:10px 11px;border-radius:9px;font-size:13px;font-weight:700}.tab:hover,.tab.active{background:#151515;color:#fff}.tab.active:before{content:'•';color:var(--acid);margin-right:8px}.side-bottom{margin-top:24px;border-top:1px solid var(--line);padding-top:14px;display:grid;gap:8px}.side-bottom a,.side-bottom button{width:100%;text-align:left}
.main{min-width:0}.topbar{position:sticky;top:0;z-index:20;height:72px;border-bottom:1px solid var(--line);background:rgba(8,8,8,.9);backdrop-filter:blur(18px);display:flex;align-items:center;justify-content:space-between;gap:18px;padding:0 24px}.top-title{font-size:14px;font-weight:850}.top-sub{font-size:11px;color:var(--muted);margin-top:3px}.top-actions{display:flex;gap:8px;align-items:center}.save-state{font:700 9px monospace;color:#777;margin-right:6px}.content{padding:26px;max-width:1180px}.panel-head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:22px}.panel-head h2{font-size:42px;letter-spacing:-.05em;margin:0}.panel-head p{margin:6px 0 0;color:var(--muted);line-height:1.5}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{border:1px solid var(--line);background:#0d0d0d;padding:18px;margin-bottom:14px}.card-title{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:14px}.card-title h3{font-size:16px;margin:0}.muted{color:var(--muted)}.array-card{border:1px solid var(--line);background:#111;padding:14px;margin-bottom:10px}.array-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:13px}.array-top strong{font-size:13px}.row-actions{display:flex;gap:6px}.checkbox-row{display:flex;align-items:center;gap:8px;padding-top:24px}.checkbox-row input{width:auto}.image-row{display:grid;grid-template-columns:1fr auto;gap:8px}.preview-img{width:100%;max-height:170px;object-fit:cover;border:1px solid var(--line);margin-top:8px;background:#070707}.color-field{display:grid;grid-template-columns:52px 1fr;gap:8px}.color-field input[type=color]{height:43px;padding:4px}.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px}.codearea{min-height:520px!important;font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace}.notice{border:1px solid #34401f;background:#10150b;color:#cfee9d;padding:12px 13px;font-size:12px;line-height:1.55;margin-bottom:15px}.messages{display:grid;gap:10px}.message{border:1px solid var(--line);padding:15px;background:#0d0d0d}.message-head{display:flex;justify-content:space-between;gap:12px;font-size:12px}.message p{color:#b8b8b8;line-height:1.55;white-space:pre-wrap}.pill{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:5px 8px;font:700 9px monospace;color:#aaa}.empty{padding:28px;border:1px dashed var(--line);color:#777;text-align:center}.toast{position:fixed;right:20px;bottom:20px;z-index:50;background:#181818;border:1px solid var(--line);padding:12px 14px;box-shadow:0 20px 60px #000;font-size:12px;transform:translateY(20px);opacity:0;pointer-events:none;transition:.22s}.toast.show{transform:none;opacity:1}.toast.good{border-color:#3c5b22;color:#d9ffac}.toast.bad{border-color:#5c2929;color:#ffabab}
@media(max-width:900px){.app{grid-template-columns:1fr}.sidebar{position:relative;height:auto;border-right:0;border-bottom:1px solid var(--line)}.tabs{grid-template-columns:repeat(3,1fr)}.tab{text-align:center}.side-bottom{grid-template-columns:1fr 1fr}.topbar{top:0}.grid2,.grid3{grid-template-columns:1fr}.content{padding:18px}}
@media(max-width:560px){.tabs{grid-template-columns:repeat(2,1fr)}.topbar{height:auto;padding:12px 14px;align-items:flex-start}.top-actions{flex-wrap:wrap;justify-content:flex-end}.panel-head h2{font-size:34px}}
</style>
</head>
<body>
<section class="auth" id="authView">
  <div class="auth-card">
    <div class="auth-kicker">Graphlair / hidden control</div>
    <h1>Lair Vault.</h1>
    <p>Sign in with your Supabase admin account. This page has no link on the public website.</p>
    <form id="loginForm" class="stack">
      <div class="field"><label>Email</label><input id="loginEmail" type="email" autocomplete="username" required></div>
      <div class="field"><label>Password</label><input id="loginPassword" type="password" autocomplete="current-password" required></div>
      <button class="primary" type="submit">Enter CMS ↗</button>
      <div class="msg" id="loginMsg"></div>
    </form>
  </div>
</section>

<section class="app hidden" id="appView">
  <aside class="sidebar">
    <div class="side-brand">Graph<b>lair</b> CMS</div>
    <div class="side-label">Content</div>
    <nav class="tabs" id="tabs"></nav>
    <div class="side-bottom">
      <a class="secondary tiny" href="../" target="_blank">Open website ↗</a>
      <button class="secondary tiny" id="logoutBtn">Sign out</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div><div class="top-title" id="topTitle">Site</div><div class="top-sub" id="topSub">Edit Graphlair content without touching code.</div></div>
      <div class="top-actions"><span class="save-state" id="saveState">Not saved</span><button class="secondary tiny" id="backupBtn">Backup JSON</button><button class="primary" id="saveBtn">Save changes</button></div>
    </header>
    <div class="content" id="editor"></div>
  </main>
</section>

<div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../config.js"></script>
<script src="../default-content.js"></script>
<script src="./admin.js"></script>
</body>
</html>
