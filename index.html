<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Graphlair</title>
  <link rel="icon" id="site-favicon" href="data:," />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="app"><div class="loading">Loading Graphlair…</div></div>
  <script>
    // GitHub Pages SPA fallback restore.
    const redirect = sessionStorage.getItem('graphlair_redirect');
    if (redirect) {
      sessionStorage.removeItem('graphlair_redirect');
      history.replaceState(null, '', redirect);
    }
  </script>
  <script type="module" src="./app.js"></script>
</body>
</html>
